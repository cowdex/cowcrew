[project]
name = "cowcrew"
version = "0.1.0"
description = "CowCrew: an open-source AI software factory. Five Claude agents plan, code, test, review and fix CI; you approve the plan and merge the PR."
keywords = ["ai-agents", "agentic-ai", "software-factory", "claude", "claude-agent-sdk", "multi-agent", "code-review", "devsecops", "human-in-the-loop"]
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.7",
    "claude-agent-sdk>=0.2.178",
    "pywebview>=5.0; sys_platform == 'darwin'",
]

[project.urls]
Homepage = "https://github.com/cowdex/cowcrew"
Repository = "https://github.com/cowdex/cowcrew"
Issues = "https://github.com/cowdex/cowcrew/issues"

[project.scripts]
cowcrew = "cowcrew.cli:main"

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.24",
    "httpx>=0.27",
    "ruff>=0.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["cowcrew"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF", "S", "ASYNC"]
ignore = ["S101", "S603", "S607", "S311", "RUF001", "RUF002", "RUF003"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S", "ASYNC"]
# SQL fragments there are built from code constants only; values are always bound parameters.
"cowcrew/overview.py" = ["S608"]
